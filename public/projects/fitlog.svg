<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="fitBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#fitBgGrad)" />

  <!-- Background decorative rings -->
  <circle cx="1050" cy="150" r="280" fill="#3b82f6" opacity="0.06" filter="blur(40px)" />
  <circle cx="150" cy="600" r="300" fill="#6366f1" opacity="0.08" filter="blur(50px)" />

  <g filter="url(#shadow2)" transform="translate(60, 40)">
    <!-- Browser Chrome Frame -->
    <rect width="1080" height="670" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect width="1080" height="52" rx="16" fill="#1e293b" />
    <rect y="40" width="1080" height="12" fill="#1e293b" />
    <line x1="0" y1="52" x2="1080" y2="52" stroke="#334155" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="28" cy="26" r="6.5" fill="#ef4444" />
    <circle cx="48" cy="26" r="6.5" fill="#f59e0b" />
    <circle cx="68" cy="26" r="6.5" fill="#10b981" />

    <!-- Address Bar -->
    <rect x="240" y="12" width="600" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="540" y="31" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
      🔒 https://fitlog-ph-s.vercel.app
    </text>

    <!-- App Header Navbar -->
    <g transform="translate(0, 52)">
      <rect width="1080" height="64" fill="#0f172a" />
      <line x1="0" y1="64" x2="1080" y2="64" stroke="#1e293b" stroke-width="1" />

      <!-- Brand Logo -->
      <rect x="36" y="16" width="32" height="32" rx="8" fill="url(#accentGrad)" />
      <text x="52" y="38" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">⚡</text>
      <text x="80" y="38" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold">Fit<tspan fill="#3b82f6">Log</tspan></text>

      <!-- Nav links -->
      <text x="210" y="38" fill="#93c5fd" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Explore Workouts</text>
      <text x="360" y="38" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13">Saved Plans</text>
      <text x="480" y="38" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13">Analytics</text>

      <!-- Badge Pill: Active Routine -->
      <rect x="910" y="16" width="130" height="32" rx="16" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="975" y="36" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Plan: 4 / 5 Exercises</text>
    </g>

    <!-- App Body Content -->
    <g transform="translate(40, 140)">
      <!-- Top Stats Bar -->
      <g transform="translate(0, 0)">
        <rect width="310" height="80" rx="12" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1" />
        <text x="20" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Total Exercises in Library</text>
        <text x="20" y="64" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold">12 <tspan font-size="14" fill="#64748b">Workouts</tspan></text>

        <rect x="345" y="0" width="310" height="80" rx="12" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1" />
        <text x="365" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Daily Workout Target</text>
        <text x="365" y="64" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold">45 <tspan font-size="14" fill="#64748b">Minutes</tspan></text>

        <rect x="690" y="0" width="310" height="80" rx="12" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1" />
        <text x="710" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Calories Burned (Est.)</text>
        <text x="710" y="64" fill="#f43f5e" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold">380 <tspan font-size="14" fill="#64748b">kCal</tspan></text>
      </g>

      <!-- Exercise Cards Grid -->
      <g transform="translate(0, 110)">
        <text x="0" y="20" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">Popular Workout Routines</text>

        <g transform="translate(0, 40)">
          <!-- Workout Card 1 -->
          <g transform="translate(0, 0)">
            <rect width="310" height="270" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
            <rect width="310" height="120" rx="12" fill="#2d3748" />
            <rect y="100" width="310" height="20" fill="#2d3748" />
            <!-- Graphic Illustration in Card -->
            <circle cx="155" cy="60" r="30" fill="#3b82f6" opacity="0.4" />
            <text x="155" y="68" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="24" text-anchor="middle">🏋️‍♂️</text>

            <text x="20" y="152" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">Incline Dumbbell Press</text>
            <text x="20" y="174" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Chest &amp; Triceps · 4 Sets · 12 Reps</text>
            <rect x="20" y="190" width="65" height="22" rx="4" fill="#3b82f6" opacity="0.2" />
            <text x="52" y="205" fill="#60a5fa" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">15 Mins</text>
            
            <rect x="20" y="226" width="270" height="32" rx="6" fill="#3b82f6" />
            <text x="155" y="247" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+ Add to Plan</text>
          </g>

          <!-- Workout Card 2 -->
          <g transform="translate(345, 0)">
            <rect width="310" height="270" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
            <rect width="310" height="120" rx="12" fill="#312e81" />
            <rect y="100" width="310" height="20" fill="#312e81" />
            <circle cx="155" cy="60" r="30" fill="#6366f1" opacity="0.4" />
            <text x="155" y="68" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="24" text-anchor="middle">🏃‍♂️</text>

            <text x="20" y="152" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">High-Intensity Intervals</text>
            <text x="20" y="174" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Cardio Endurance · 6 Rounds</text>
            <rect x="20" y="190" width="65" height="22" rx="4" fill="#6366f1" opacity="0.2" />
            <text x="52" y="205" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">20 Mins</text>
            
            <rect x="20" y="226" width="270" height="32" rx="6" fill="#10b981" />
            <text x="155" y="247" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✓ Added to Plan</text>
          </g>

          <!-- Workout Card 3 -->
          <g transform="translate(690, 0)">
            <rect width="310" height="270" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
            <rect width="310" height="120" rx="12" fill="#374151" />
            <rect y="100" width="310" height="20" fill="#374151" />
            <circle cx="155" cy="60" r="30" fill="#10b981" opacity="0.4" />
            <text x="155" y="68" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="24" text-anchor="middle">🧘‍♀️</text>

            <text x="20" y="152" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">Full Body Mobility &amp; Stretch</text>
            <text x="20" y="174" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Flexibility · Recovery Routine</text>
            <rect x="20" y="190" width="65" height="22" rx="4" fill="#10b981" opacity="0.2" />
            <text x="52" y="205" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">10 Mins</text>
            
            <rect x="20" y="226" width="270" height="32" rx="6" fill="#3b82f6" />
            <text x="155" y="247" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+ Add to Plan</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
