<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
    <line x1="900" y1="0" x2="900" y2="750" />
  </g>

  <!-- Browser Window Container -->
  <g filter="url(#shadow)" transform="translate(60, 40)">
    <!-- Browser Chrome Frame -->
    <rect width="1080" height="670" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect width="1080" height="52" rx="16" fill="#1e293b" />
    <rect y="40" width="1080" height="12" fill="#1e293b" />
    <line x1="0" y1="52" x2="1080" y2="52" stroke="#334155" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="28" cy="26" r="6.5" fill="#ef4444" />
    <circle cx="48" cy="26" r="6.5" fill="#f59e0b" />
    <circle cx="68" cy="26" r="6.5" fill="#10b981" />

    <!-- Address Bar -->
    <rect x="240" y="12" width="600" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="540" y="31" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
      🔒 https://bazardor-nu.vercel.app
    </text>

    <!-- App Header Navbar -->
    <g transform="translate(0, 52)">
      <rect width="1080" height="64" fill="#0f172a" border-bottom="1" />
      <line x1="0" y1="64" x2="1080" y2="64" stroke="#1e293b" stroke-width="1" />
      
      <!-- Brand Logo -->
      <circle cx="48" cy="32" r="16" fill="#10b981" />
      <text x="48" y="38" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">ব</text>
      <text x="76" y="38" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold">Bazardor</text>
      <text x="170" y="38" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">(বাজারদর)</text>

      <!-- Ticker Pill -->
      <rect x="360" y="16" width="360" height="32" rx="16" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <circle cx="378" cy="32" r="4" fill="#34d399" />
      <text x="392" y="37" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">লাইভ বাজারদর আপডেট: চাল ৳৬৫ (↑ ২%) · পেঁয়াজ ৳৮৫ (↓ ৪%)</text>

      <!-- Auth Buttons -->
      <rect x="940" y="18" width="96" height="28" rx="6" fill="#10b981" />
      <text x="988" y="36" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">লগইন</text>
    </g>

    <!-- App Body Content -->
    <g transform="translate(40, 140)">
      <!-- Hero / Metric Bar -->
      <text x="0" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="bold">নিত্যপ্রয়োজনীয় পণ্যের বাজার বিশ্লেষণ</text>
      <text x="0" y="48" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">আজকের সর্বোচ্চ দর বৃদ্ধি এবং দর পতন হওয়া পণ্যসমূহ</text>

      <!-- Price Cards Grid -->
      <g transform="translate(0, 70)">
        <!-- Card 1: Rice -->
        <g transform="translate(0, 0)">
          <rect width="232" height="130" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
          <text x="16" y="32" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">মিনিকেট চাল</text>
          <text x="16" y="52" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">খাদ্যশস্য · প্রতি কেজি</text>
          <text x="16" y="94" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold">৳ ৬৮.৫০</text>
          <rect x="156" y="20" width="60" height="22" rx="6" fill="#7f1d1d" />
          <text x="186" y="35" fill="#f87171" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">↑ ২.৪%</text>
        </g>

        <!-- Card 2: Onion -->
        <g transform="translate(256, 0)">
          <rect width="232" height="130" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
          <text x="16" y="32" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">দেশি পেঁয়াজ</text>
          <text x="16" y="52" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">সবজি ও মসলা · প্রতি কেজি</text>
          <text x="16" y="94" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold">৳ ৮৫.০০</text>
          <rect x="156" y="20" width="60" height="22" rx="6" fill="#064e3b" />
          <text x="186" y="35" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">↓ ৫.১%</text>
        </g>

        <!-- Card 3: Soybean Oil -->
        <g transform="translate(512, 0)">
          <rect width="232" height="130" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
          <text x="16" y="32" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">সয়াবিন তেল</text>
          <text x="16" y="52" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">ভোজ্যতেল · ১ লিটার বোতল</text>
          <text x="16" y="94" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold">৳ ১৬৮.০০</text>
          <rect x="156" y="20" width="60" height="22" rx="6" fill="#1e293b" />
          <text x="186" y="35" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">০.০%</text>
        </g>

        <!-- Card 4: Green Chili -->
        <g transform="translate(768, 0)">
          <rect width="232" height="130" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
          <text x="16" y="32" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">কাঁচা মরিচ</text>
          <text x="16" y="52" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">সবজি · প্রতি কেজি</text>
          <text x="16" y="94" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold">৳ ১২০.০০</text>
          <rect x="156" y="20" width="60" height="22" rx="6" fill="#064e3b" />
          <text x="186" y="35" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">↓ ৮.৩%</text>
        </g>
      </g>

      <!-- Chart Panel -->
      <g transform="translate(0, 220)">
        <rect width="1000" height="210" rx="14" fill="#131d2e" stroke="#1e293b" stroke-width="1" />
        <text x="24" y="32" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold">মূল্য পরিবর্তনের গতিপ্রকৃতি (গত ৩০ দিনের গড় বাজারদর)</text>
        
        <!-- Chart Curves -->
        <path d="M 40,160 Q 200,80 400,120 T 700,70 T 960,110 L 960,180 L 40,180 Z" fill="url(#chartGrad)" />
        <path d="M 40,160 Q 200,80 400,120 T 700,70 T 960,110" fill="none" stroke="#10b981" stroke-width="3.5" />
        
        <!-- Points -->
        <circle cx="400" cy="120" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
        <circle cx="700" cy="70" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
        <circle cx="960" cy="110" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />

        <!-- X Axis labels -->
        <text x="50" y="195" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">১ম সপ্তাহ</text>
        <text x="360" y="195" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">২য় সপ্তাহ</text>
        <text x="680" y="195" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">৩য় সপ্তাহ</text>
        <text x="920" y="195" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">চলতি সপ্তাহ</text>
      </g>
    </g>
  </g>
</svg>
